# Shared proxy settings, included in each server block of nginx.conf.
# Adapted from runpod/containers container-template/proxy (MIT, see README).
# Keep every proxy_set_header at the server level: a proxy_set_header inside
# a location would drop all of these for that location.

client_max_body_size 1024M;

proxy_http_version 1.1;
proxy_read_timeout 600;
proxy_send_timeout 600;

proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_set_header Host              $proxied_host;
proxy_set_header X-Forwarded-Host  $proxied_host;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP         $remote_addr;

# Shown while the app is still starting (or has crashed).
error_page 502 /502.html;
location = /502.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    internal;
}
