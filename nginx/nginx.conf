# Login-protected front door for both apps. The apps listen only on
# 127.0.0.1; Runpod exposes nginx's ports 3000 and 3020.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
# Errors go to a file, not the pod log. A Forge restart logs a burst of
# harmless "connect() failed" lines while the browser waits for it.
error_log /var/log/nginx/error.log;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Maps must live at the http level; proxy.conf uses them.

    # WebSocket upgrades (Gradio, ComfyUI live progress).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Keep https when the request came through Runpod's https proxy.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Prefer X-Forwarded-Host so the apps build URLs with the public
    # hostname instead of the pod's internal IP. From
    # ashleykleynhans/stable-diffusion-docker nginx/nginx.conf.
    map $http_x_forwarded_host $proxied_host {
        default $host;
        "~."    $http_x_forwarded_host;
    }

    # Forge Neo
    server {
        listen 3000;

        auth_basic "Forge Neo";
        auth_basic_user_file /etc/nginx/.htpasswd;

        include /etc/nginx/proxy.conf;

        location / {
            proxy_pass http://127.0.0.1:3001;
        }
    }

    # ComfyUI
    server {
        listen 3020;

        auth_basic "ComfyUI";
        auth_basic_user_file /etc/nginx/.htpasswd;

        include /etc/nginx/proxy.conf;
        # ComfyUI rejects some requests it thinks are cross-site.
        proxy_set_header Sec-Fetch-Site same-origin;

        location / {
            proxy_pass http://127.0.0.1:3021;
        }
    }
}
